apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-gke-config
  labels:
    app: hello-gke
    version: v1
data:
  # Application configuration
  ENVIRONMENT: "production"
  GREETING_MESSAGE: "Hello from Google Kubernetes Engine!"

  # Logging configuration
  LOG_LEVEL: "INFO"

  # Application settings
  APP_NAME: "hello-gke"
  APP_VERSION: "1.0.0"

  # Kubernetes-specific settings
  NAMESPACE: "default"
  SERVICE_ACCOUNT: "default"
